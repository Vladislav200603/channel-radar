name: Collect channel updates

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: channel-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake service and collect
        env:
          SERVICE_URL: https://channel-radar-6kls.onrender.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$SERVICE_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent \
            --retry 1 --retry-delay 8 --max-time 240 \
            --output "$RUNNER_TEMP/channel-collection.json" \
            -X POST "$SERVICE_URL/internal/collect-all" \
            -H "Authorization: Bearer $CRON_SECRET"
          python - "$RUNNER_TEMP/channel-collection.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as result_file:
              result = json.load(result_file)
          collected = int(result["collected"])
          healthy = int(result["healthy"])
          degraded = int(result.get("backfilling", result.get("degraded", 0)))
          errors = result.get("errors", result.get("error", 0))
          error_count = len(errors) if isinstance(errors, list) else int(errors)
          available = int(result.get("source_healthy", healthy + degraded))
          source_errors = result.get("source_errors", [])
          print(f"Collected {collected}: healthy={healthy}, backfill={degraded}, errors={error_count}")
          print(f"Available sources after collection: {available}; source errors: {len(source_errors)}")
          if error_count:
              print(f"::warning::{error_count} channel(s) could not be collected; inspect source status on the dashboard.")
          if not (healthy + degraded) and not available and (collected or source_errors):
              print("::error::No channel is available after collection, including the startup sweep.")
              sys.exit(1)
          PY
